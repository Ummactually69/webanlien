<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rung Chuông Vàng - Pro Edition</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #B8860B;
            --bg-color: #1a1a2e;
            --text-white: #ffffff;
            --error-red: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
            transition: transform 0.1s;
        }

        /* Hiệu ứng rung màn hình khi thua */
        .shake {
            animation: shake 0.5s screen;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        h1 {
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        #question-counter {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--primary-gold);
        }

        #question-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            min-height: 80px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background: var(--primary-gold);
            color: black;
            transform: translateY(-3px);
        }

        /* Màn hình kết quả */
        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .bell {
            font-size: 100px;
            filter: drop-shadow(0 0 10px var(--primary-gold));
        }

        /* Animation Chuông Vàng */
        .ring-animation {
            animation: ring 0.8s infinite ease-in-out;
        }

        @keyframes ring {
            0% { transform: rotate(0); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
            100% { transform: rotate(0); }
        }

        /* Animation Chuông Vỡ */
        .break-animation {
            animation: break 1s forwards cubic-bezier(0.17, 0.67, 0.83, 0.67);
            position: relative;
        }

        @keyframes break {
            0% { transform: scale(1); opacity: 1; }
            45% { transform: scale(1.2) rotate(5deg); filter: grayscale(0.5); }
            50% { transform: scale(1.1) rotate(-5deg); filter: sepia(1) saturate(5); }
            100% { transform: translateY(100px) rotate(45deg); opacity: 0; }
        }

        .status-text {
            margin-top: 20px;
            font-size: 2rem;
            font-weight: bold;
        }

        .win-text { color: var(--primary-gold); }
        .lose-text { color: var(--error-red); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="quiz-part">
        <h1>Rung Chuông Vàng</h1>
        <div id="question-counter">Câu hỏi 1/4</div>
        <div id="question-text">Đang tải câu hỏi...</div>
        
        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)">A</button>
            <button class="option-btn" onclick="checkAnswer(1)">B</button>
            <button class="option-btn" onclick="checkAnswer(2)">C</button>
            <button class="option-btn" onclick="checkAnswer(3)">D</button>
        </div>
    </div>

    <!-- Màn hình Chiến thắng -->
    <div id="victory-screen" class="screen">
        <div class="bell ring-animation">🔔</div>
        <div class="status-text win-text">BẠN ĐÃ RUNG CHUÔNG VÀNG!</div>
        <button class="option-btn" style="margin-top: 30px;" onclick="resetGame()">Chơi lại</button>
    </div>

    <!-- Màn hình Thất bại -->
    <div id="failure-screen" class="screen">
        <div class="bell" id="broken-bell">🔔</div>
        <div class="status-text lose-text">CHUÔNG ĐÃ VỠ!</div>
        <p>Rất tiếc, bạn đã trả lời sai và phải rời sân.</p>
        <button class="option-btn" style="margin-top: 30px; border-color: var(--error-red); color: white;" onclick="resetGame()">Thử lại</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Câu đầu: Đâu là thủ đô của Việt Nam?",
            options: ["Đà Nẵng", "Hà Nội", "TP. Hồ Chí Minh", "Hải Phòng"],
            correct: 1
        },
        {
            q: "Câu giữa: Con gì béo nhất?",
            options: ["Con Hổ", "Con Voi", "Con Kiến", "Con mẹ mày béo"],
            correct: 3
        },
        {
            q: "Câu cuối: Số nào tiếp theo trong dãy: 1, 2, 3, 4, 5, ...?",
            options: ["6", "7", "8", "9"],
            correct: 0
        },
        {
            q: "Mục đích của sự sống là gì?",
            options: ["Tôi hông biết", "Tại sao..", "Hả", "Gì cơ"],
            correct: "ALWAYS_TRUE" // Logic đặc biệt: Chọn gì cũng đúng
        }
    ];

    let currentQuestion = 0;

    function loadQuestion() {
        const qData = questions[currentQuestion];
        document.getElementById("question-counter").innerText = `Câu hỏi ${currentQuestion + 1}/${questions.length}`;
        document.getElementById("question-text").innerText = qData.q;
        
        const btns = document.querySelectorAll(".option-btn");
        qData.options.forEach((opt, index) => {
            if(index < 4) btns[index].innerText = opt;
        });
    }

    function checkAnswer(index) {
        const qData = questions[currentQuestion];
        
        // Kiểm tra đúng nếu là câu cuối (correct === "ALWAYS_TRUE") hoặc chọn đúng index
        if (qData.correct === "ALWAYS_TRUE" || index === qData.correct) {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showScreen("victory-screen");
            }
        } else {
            showFailure();
        }
    }

    function showScreen(screenId) {
        document.getElementById("quiz-part").classList.add("hidden");
        document.getElementById(screenId).style.display = "flex";
    }

    function showFailure() {
        // Hiệu ứng rung container
        const container = document.getElementById("game-container");
        container.classList.add("shake");
        
        showScreen("failure-screen");
        
        // Kích hoạt animation chuông vỡ
        const bell = document.getElementById("broken-bell");
        bell.innerText = "🔔"; // Reset chuông
        bell.classList.add("break-animation");
        
        // Sau khi vỡ thì đổi icon thành mảnh vụn (tùy chọn)
        setTimeout(() => {
            bell.innerText = "💔";
            container.classList.remove("shake");
        }, 800);
    }

    function resetGame() {
        currentQuestion = 0;
        document.getElementById("quiz-part").classList.remove("hidden");
        document.getElementById("victory-screen").style.display = "none";
        document.getElementById("failure-screen").style.display = "none";
        document.getElementById("broken-bell").classList.remove("break-animation");
        document.getElementById("broken-bell").innerText = "🔔";
        loadQuestion();
    }

    // Khởi tạo game
    loadQuestion();
</script>

</body>
</html>
