<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rung Chuông Vàng - Pro Edition</title>
    
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #B8860B;
            --bg-color: #1a1a2e;
            --text-white: #ffffff;
            --error-red: #ff4d4d;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            background: var(--glass-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
        }

        .view-counter {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ff88;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(0.9); }
        }

        #views-number { color: #ffffff; font-weight: bold; }
        .view-label { color: #888; font-size: 0.7rem; text-transform: uppercase; }

        .title-group h1 {
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0px; 
            font-size: 2.5rem;
        }
        .title-group h2 {
            color: var(--error-red);
            font-size: 1.2rem;
            margin-top: 5px; 
            margin-bottom: 30px;
            font-style: italic;
            opacity: 0.8;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 15px;
            display: block;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
        }

        .btn:hover {
            background: var(--primary-gold);
            color: black;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-secret { border-color: #ff00ff; color: #ff00ff; }
        .btn-secret:hover { background: #ff00ff !important; color: white !important; }

        .screen { display: none; flex-direction: column; animation: fadeIn 0.5s; }
        .active-screen { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .bell { font-size: 100px; filter: drop-shadow(0 0 10px var(--primary-gold)); margin-bottom: 20px; }
        .ring-animation { animation: ring 0.8s infinite ease-in-out; }
        @keyframes ring {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }

        .break-animation {
            animation: break 1.2s forwards cubic-bezier(0.17, 0.67, 0.83, 0.67);
            position: relative;
        }
        @keyframes break {
            0% { transform: scale(1); opacity: 1; }
            45% { transform: scale(1.2) rotate(5deg); filter: grayscale(0.5); }
            50% { transform: scale(1.1) rotate(-5deg); filter: sepia(1) saturate(5); }
            100% { transform: translateY(200px) rotate(45deg); opacity: 0; }
        }

        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #question-counter { color: var(--primary-gold); font-weight: bold; margin-bottom: 10px; }
        #question-text { font-size: 1.4rem; min-height: 80px; margin-bottom: 25px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        @media (max-width: 480px) {
            .options-grid { grid-template-columns: 1fr; }
            .title-group h1 { font-size: 1.8rem; }
            .view-counter { top: 10px; right: 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="view-counter">
        <div class="live-dot"></div>
        <span id="views-number">...</span>
        <span class="view-label">truy cập</span>
    </div>

    <div id="menu-screen" class="screen active-screen">
        <div class="title-group">
            <h1>Rung Chuông Vàng</h1>
            <h2>Made by CMD34</h2>
        </div>
        <button class="btn" onclick="switchScreen('quiz-part')">BẮT ĐẦU CHƠI</button>
        <button class="btn" onclick="switchScreen('settings-screen')">CÀI ĐẶT</button>
        <button class="btn" onclick="switchScreen('credits-screen')">THÔNG TIN</button>
    </div>

    <div id="settings-screen" class="screen">
        <h1>Cài Đặt</h1>
        <p>Âm thanh: Không có sẵn</p>
        <p>Độ khó: Trẻ em</p>
        <button class="btn" onclick="switchScreen('menu-screen')">QUAY LẠI</button>
    </div>

    <div id="credits-screen" class="screen">
        <h1>Thông Tin</h1>
        <p>Phiên bản: Pro Edition v7.0</p>
        <p>Made by HPK and CMD34</p>
        <button class="btn btn-secret" onclick="window.open('https://www.youtube.com/watch?v=oyEOohYtgvI', '_blank')">
            QUÀ TẶNG BÍ MẬT 🎁
        </button>
        <button class="btn" onclick="switchScreen('menu-screen')">QUAY LẠI</button>
    </div>

    <div id="quiz-part" class="screen">
        <div id="question-counter">Câu hỏi 1/4</div>
        <div id="question-text">Đang tải...</div>
        <div class="options-grid">
            <button class="btn quiz-opt" onclick="checkAnswer(0)">A</button>
            <button class="btn quiz-opt" onclick="checkAnswer(1)">B</button>
            <button class="btn quiz-opt" onclick="checkAnswer(2)">C</button>
            <button class="btn quiz-opt" onclick="checkAnswer(3)">D</button>
        </div>
    </div>

    <div id="victory-screen" class="screen">
        <div class="bell ring-animation">🔔</div>
        <div style="color:var(--primary-gold); font-size: 1.5rem; font-weight: bold; margin-bottom: 20px;">BẠN ĐÃ RUNG CHUÔNG VÀNG!</div>
        <button class="btn" onclick="resetGame()">CHƠI LẠI</button>
    </div>

    <div id="failure-screen" class="screen">
        <div class="bell" id="broken-bell">🔔</div>
        <div style="color:var(--error-red); font-size: 1.5rem; font-weight: bold; margin-bottom: 10px;">CHUÔNG ĐÃ VỠ!</div>
        <p style="margin-bottom: 20px;">Bạn đã trả lời sai rồi...</p>
        <button class="btn" style="border-color: var(--error-red)" onclick="resetGame()">THỬ LẠI</button>
    </div>
</div>

<script>
    // --- DỮ LIỆU CÂU HỎI ---
    const questions = [
        { q: "Đâu là thủ đô của Việt Nam?", options: ["Đà Nẵng", "Hà Nội", "TP. Hồ Chí Minh", "Hải Phòng"], correct: 1 },
        { q: "Con gì béo nhất trong các lựa chọn sau?", options: ["Con Hổ", "Con Voi", "Con Kiến", "Con mẹ mày béo"], correct: 3 },
        { q: "Số nào tiếp theo trong dãy: 1, 2, 3, 4, 5, ...?", options: ["6", "7", "8", "9"], correct: 0 },
        { q: "Mục đích của sự sống là gì?", options: ["Hả?", "Lọ", "Làm giàu", "Tôi không biết"], correct: "ALWAYS_TRUE" }
    ];

    let currentQuestion = 0;

    // --- BỘ ĐẾM TRUY CẬP THỰC TẾ (ĐÃ FIX LINK 404) ---
    // Namespace mới để đảm bảo hoạt động: 'cmd34_rung_chuong_vang_pro'
    const API_URL = "https://api.counterapi.dev/v1/cmd34_rung_chuong_vang_pro/visits/up";

    async function getVisits() {
        try {
            // Thêm timeout để tránh chờ quá lâu khi mạng lỗi
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            const response = await fetch(API_URL, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) throw new Error("API lỗi hoặc không tồn tại");

            const data = await response.json();
            document.getElementById("views-number").innerText = data.count.toLocaleString();
        } catch (e) {
            console.warn("Đang dùng bộ đếm dự phòng do lỗi:", e.message);
            // Nếu lỗi (như chạy offline), hiển thị số ngẫu nhiên cho đẹp
            let randomViews = Math.floor(Math.random() * 50) + 950; 
            document.getElementById("views-number").innerText = randomViews;
        }
    }
    
    getVisits();

    // --- LOGIC GAME ---
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        const target = document.getElementById(screenId);
        target.style.display = 'flex';
        target.classList.add('active-screen');
        if(screenId === 'quiz-part') loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentQuestion];
        document.getElementById("question-counter").innerText = `Câu hỏi ${currentQuestion + 1}/${questions.length}`;
        document.getElementById("question-text").innerText = qData.q;
        const btns = document.querySelectorAll(".quiz-opt");
        btns.forEach((btn, index) => btn.innerText = qData.options[index]);
    }

    function checkAnswer(index) {
        const qData = questions[currentQuestion];
        if (qData.correct === "ALWAYS_TRUE" || index === qData.correct) {
            currentQuestion++;
            if (currentQuestion < questions.length) loadQuestion();
            else switchScreen('victory-screen');
        } else {
            showFailure();
        }
    }

    function showFailure() {
        const container = document.getElementById("game-container");
        container.classList.add("shake");
        switchScreen('failure-screen');
        const bell = document.getElementById("broken-bell");
        bell.innerText = "🔔";
        bell.classList.remove("break-animation");
        void bell.offsetWidth; 
        bell.classList.add("break-animation");
        setTimeout(() => { bell.innerText = "💔"; }, 450);
        setTimeout(() => container.classList.remove("shake"), 500);
    }

    function resetGame() {
        currentQuestion = 0;
        const bell = document.getElementById("broken-bell");
        bell.classList.remove("break-animation");
        bell.innerText = "🔔";
        switchScreen('menu-screen');
    }
</script>

</body>
</html>
