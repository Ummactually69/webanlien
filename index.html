<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rung Chuông Vàng - Mini Game</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #B8860B;
            --bg-color: #1a1a2e;
            --text-white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        #question-counter {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--primary-gold);
        }

        #question-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            min-height: 80px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background: var(--primary-gold);
            color: black;
            transform: translateY(-3px);
        }

        /* Hiệu ứng Chuông */
        #victory-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            border-radius: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .bell {
            font-size: 100px;
            filter: drop-shadow(0 0 10px var(--primary-gold));
            animation: none;
        }

        @keyframes ring {
            0% { transform: rotate(0); }
            10% { transform: rotate(20deg); }
            20% { transform: rotate(-15deg); }
            30% { transform: rotate(15deg); }
            40% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            60% { transform: rotate(-5deg); }
            100% { transform: rotate(0); }
        }

        .ring-animation {
            animation: ring 0.8s infinite ease-in-out;
        }

        .congrats-text {
            margin-top: 20px;
            font-size: 2rem;
            color: var(--primary-gold);
            font-weight: bold;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="quiz-part">
        <h1>Rung Chuông Vàng</h1>
        <div id="question-counter">Câu hỏi 1/4</div>
        <div id="question-text">Đang tải câu hỏi...</div>
        
        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)">A</button>
            <button class="option-btn" onclick="checkAnswer(1)">B</button>
            <button class="option-btn" onclick="checkAnswer(2)">C</button>
            <button class="option-btn" onclick="checkAnswer(3)">D</button>
        </div>
    </div>

    <div id="victory-screen">
        <div class="bell" id="golden-bell">🔔</div>
        <div class="congrats-text">BẠN ĐÃ RUNG CHUÔNG VÀNG!</div>
        <button class="option-btn" style="margin-top: 30px;" onclick="resetGame()">Chơi lại</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Câu đầu: Đâu là thủ đô của Việt Nam?",
            options: ["Đà Nẵng", "Hà Nội", "TP. Hồ Chí Minh", "Hải Phòng"],
            correct: 1
        },
        {
            q: "Câu giữa: Con vật nào là biểu tượng của ngành y?",
            options: ["Con Hổ", "Con Đại Bàng", "Con Rắn", "Con Voi"],
            correct: 2
        },
        {
            q: "Câu cuối: Số nào tiếp theo trong dãy: 1, 2, 3, 4, 5, ...?",
            options: ["6", "7", "8", "9"],
            correct: 0

        },
        {
            q: "Mr P có ác ko?",
            options: ["Có", "Yes", "Chắc chắn", "Chưa biết"],
            correct: 3
        }
    ];

    let currentQuestion = 0;

    function loadQuestion() {
        const qData = questions[currentQuestion];
        document.getElementById("question-counter").innerText = `Câu hỏi ${currentQuestion + 1}/4`;
        document.getElementById("question-text").innerText = qData.q;
        
        const btns = document.querySelectorAll(".option-btn");
        qData.options.forEach((opt, index) => {
            if(index < 4) btns[index].innerText = opt;
        });
    }

    function checkAnswer(index) {
        if (index === questions[currentQuestion].correct) {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showVictory();
            }
        } else {
            alert("Rất tiếc, bạn đã trả lời sai và phải rời sân thi đấu!");
            resetGame();
        }
    }

    function showVictory() {
        document.getElementById("quiz-part").classList.add("hidden");
        document.getElementById("victory-screen").style.display = "flex";
        document.getElementById("golden-bell").classList.add("ring-animation");
    }

    function resetGame() {
        currentQuestion = 0;
        document.getElementById("quiz-part").classList.remove("hidden");
        document.getElementById("victory-screen").style.display = "none";
        document.getElementById("golden-bell").classList.remove("ring-animation");
        loadQuestion();
    }

    // Khởi tạo game lần đầu
    loadQuestion();
</script>

</body>
</html>
