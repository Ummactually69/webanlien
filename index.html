<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rung Chuông Vàng - Pro Edition 2026</title>
    
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #B8860B;
            --bg-color: #0f0f1e;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-white: #ffffff;
            --error-red: #ff4d4d;
            --success-green: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 550px;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Tiêu đề */
        .title-group h1 {
            color: var(--primary-gold);
            text-transform: uppercase;
            font-size: 2.2rem;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .title-group h2 {
            color: var(--error-red);
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: 300;
        }

        /* Nút bấm */
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--primary-gold);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 12px;
            display: block;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--primary-gold);
            color: #000;
            transform: scale(1.02);
        }

        .btn:active { transform: scale(0.98); }

        .btn-secret { border-color: #ff00ff; color: #ff00ff; }
        .btn-secret:hover { background: #ff00ff; color: white; }

        /* Các màn hình */
        .screen { display: none; flex-direction: column; animation: fadeIn 0.4s ease-out; }
        .active-screen { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Animation Chuông */
        .bell { font-size: 80px; margin-bottom: 15px; display: inline-block; }
        .ring-animation { animation: ring 0.8s infinite ease-in-out; }
        @keyframes ring {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }

        .break-animation {
            animation: break 1.2s forwards;
        }
        @keyframes break {
            0% { transform: scale(1); }
            45% { transform: scale(1.2) rotate(10deg); filter: sepia(1) saturate(5); }
            100% { transform: translateY(300px) rotate(90deg); opacity: 0; }
        }

        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Quiz UI */
        #question-counter { color: var(--primary-gold); font-size: 0.9rem; margin-bottom: 10px; opacity: 0.8; }
        #question-text { font-size: 1.3rem; font-weight: 500; min-height: 70px; margin-bottom: 20px; line-height: 1.4; }
        
        .options-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        /* Responsive cho mobile */
        @media (max-width: 480px) {
            .options-grid { grid-template-columns: 1fr; }
            .title-group h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<audio id="bg-music" loop>
    <source src="dep.mp3" type="audio/mpeg">
</audio>

<div id="game-container">
    <div id="menu-screen" class="screen active-screen">
        <div class="title-group">
            <div class="bell">🔔</div>
            <h1>Rung Chuông Vàng</h1>
            <h2>Premium Version - CMD34</h2>
        </div>
        <button class="btn" onclick="startGame()">BẮT ĐẦU CHƠI</button>
        <button class="btn" onclick="switchScreen('settings-screen')">CÀI ĐẶT</button>
        <button class="btn" onclick="switchScreen('credits-screen')">THÔNG TIN</button>
    </div>

    <div id="settings-screen" class="screen">
        <h1>Cài Đặt</h1>
        <p>Âm thanh: Tự động kích hoạt</p>
        <p>Chế độ: Vui vẻ là chính</p>
        <button class="btn" onclick="switchScreen('menu-screen')">QUAY LẠI</button>
    </div>

    <div id="credits-screen" class="screen">
        <h1>Thông Tin</h1>
        <p>Phiên bản: 6.0 Stable</p>
        <p>Developer: HPK & CMD34</p>
        <button class="btn btn-secret" onclick="window.open('https://www.youtube.com/watch?v=l3JdTYIHn-o', '_blank')">
            QUÀ TẶNG BÍ MẬT 🎁
        </button>
        <button class="btn" onclick="switchScreen('menu-screen')">QUAY LẠI</button>
    </div>

    <div id="quiz-part" class="screen">
        <div id="question-counter">Câu hỏi 1/4</div>
        <div id="question-text">Đang chuẩn bị...</div>
        <div class="options-grid" id="options-container">
            </div>
    </div>

    <div id="victory-screen" class="screen">
        <div class="bell ring-animation" style="font-size: 100px;">🔔</div>
        <h2 style="color:var(--primary-gold)">XUẤT SẮC!</h2>
        <p>Bạn đã chính thức Rung Chuông Vàng!</p>
        <button class="btn" onclick="resetGame()">CHƠI LẠI TỪ ĐẦU</button>
    </div>

    <div id="failure-screen" class="screen">
        <div class="bell" id="broken-bell">🔔</div>
        <h2 style="color:var(--error-red)">THỬ THÁCH THẤT BẠI</h2>
        <p id="fail-msg">Bạn đã trả lời sai rồi...</p>
        <button class="btn" style="border-color: var(--error-red)" onclick="resetGame()">THỬ LẠI</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Thủ đô của Việt Nam là thành phố nào?",
            options: ["Đà Nẵng", "Hà Nội", "TP. Hồ Chí Minh", "Huế"],
            correct: 1
        },
        {
            q: "Theo âm lịch, năm 2025 là năm con gì?",
            options: ["Con Rồng (Thìn)", "Con Rắn (Tỵ)", "Con Ngựa (Ngọ)", "Con Dê (Mùi)"],
            correct: 1
        },
        {
            q: "Ngày 30/4 là ngày gì?",
            options: ["Quốc Khánh", "Ngày Quốc tế đàn ông", "Giair phóng miền nam", "Ngày thứ hai"],
            correct: 2
        },
        {
            q: "Câu hỏi cuối: Xin đánh giá ?",
            options: ["Ok", "Quá chán ", "Đỉnh", "Nhìn biết chat gpt"],
            correct: "ALWAYS_TRUE"
        }
    ];

    let currentQuestion = 0;
    const bgMusic = document.getElementById('bg-music');

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    function startGame() {
        // Play nhạc khi người dùng tương tác
        bgMusic.play().catch(e => console.log("Audio play blocked"));
        currentQuestion = 0;
        switchScreen('quiz-part');
        loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentQuestion];
        document.getElementById("question-counter").innerText = `CÂU HỎI ${currentQuestion + 1}/${questions.length}`;
        document.getElementById("question-text").innerText = qData.q;
        
        const container = document.getElementById("options-container");
        container.innerHTML = ""; // Xóa các nút cũ

        qData.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            container.appendChild(btn);
        });
    }

    function checkAnswer(index) {
        const qData = questions[currentQuestion];
        
        if (qData.correct === "ALWAYS_TRUE" || index === qData.correct) {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                switchScreen('victory-screen');
            }
        } else {
            showFailure();
        }
    }

    function showFailure() {
        const container = document.getElementById("game-container");
        container.classList.add("shake");
        
        switchScreen('failure-screen');
        
        const bell = document.getElementById("broken-bell");
        bell.innerText = "🔔";
        bell.classList.remove("break-animation");
        
        void bell.offsetWidth; // Force reflow
        bell.classList.add("break-animation");
        
        // Hiệu ứng đổi mảnh vỡ sau 450ms
        setTimeout(() => { bell.innerText = "💔"; }, 450);
        setTimeout(() => container.classList.remove("shake"), 500);
    }

    function resetGame() {
        currentQuestion = 0;
        const bell = document.getElementById("broken-bell");
        bell.classList.remove("break-animation");
        bell.innerText = "🔔";
        switchScreen('menu-screen');
    }
</script>

</body>
</html>
