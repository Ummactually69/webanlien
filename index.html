<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rung Chuông Vàng - sigma</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-blue: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.8); /* Làm đậm nền card một chút để dễ đọc chữ trên GIF */
            --success: #22c55e;
            --error: #ef4444;
            --text-white: #ffffff;
            --sigma: #ff00ff;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            /* Cập nhật background GIF ở đây */
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZmgxNTl2OWQ3M2Q1dDQ2dnQyenl1c3BmMmF3N3YxdGNsbGZpN3FuYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/KBWvYMj8Zyz2zoLNfu/giphy.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px); /* Hiệu ứng kính mờ giúp nhìn xuyên qua GIF đẹp hơn */
            border: 1px solid rgba(255, 215, 0, 0.3);
            width: 90%;
            max-width: 900px;
            text-align: center;
            position: relative;
        }

        /* --- MENU CŨ --- */
        .title-group h1 {
            color: var(--primary-gold);
            text-transform: uppercase;
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .title-group h2 {
            color: #ff6b6b;
            font-size: 1.2rem;
            margin-top: 5px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn, .btn2 {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary-gold);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 12px;
            display: block;
            text-decoration: none;
        }

        .btn:hover { background: var(--primary-gold); color: #000; transform: scale(1.02); }
        .btn2:hover { background: var(--sigma); color: #000; transform: scale(1.02); }
        .btn.correct { background: var(--success) !important; border-color: var(--success); color: white; }
        .btn.wrong { background: var(--error) !important; border-color: var(--error); color: white; }
        .btn.disabled { pointer-events: none; opacity: 0.8; }

        /* --- LAYOUT 2 CỘT --- */
        .quiz-wrapper {
            display: none; 
            gap: 25px;
            text-align: left;
            margin-top: 20px;
        }

        .image-side {
            flex: 1.2;
            aspect-ratio: 16/9;
            background: #1e293b;
            border-radius: 15px;
            border: 2px solid var(--primary-gold);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-side img { width: 100%; height: 100%; object-fit: cover; }

        .question-side { flex: 1; display: flex; flex-direction: column; }
        #question-text { font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; min-height: 60px; }

        /* --- MÀN HÌNH & HIỆU ỨNG --- */
        .screen { display: none; flex-direction: column; animation: fadeIn 0.4s; }
        .active-screen { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bell { font-size: 80px; margin-bottom: 15px; display: inline-block; }
        .ring-anim { animation: ring 0.8s infinite ease-in-out; }
        @keyframes ring {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }

        #effect-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 24px;
        }
        .break-anim { animation: break 1s forwards; }
        @keyframes break {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(10deg); filter: sepia(1) saturate(3); }
            100% { transform: translateY(400px) rotate(90deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            .quiz-wrapper { flex-direction: column; }
            #game-container { max-width: 500px; padding: 1.5rem; }
        }
    </style>
</head>
<body>

<audio id="bg-music" loop><source src="dep.mp3" type="audio/mpeg"></audio>

<div id="game-container">
    <div id="menu-screen" class="screen active-screen">
        <div class="title-group">
            <div class="bell">🔔</div>
            <h1>Rung Chuông Vàng</h1>
            <h2>Sinh hoạt dưới cờ - 9A2,1,3</h2>
        </div>
        <button class="btn" onclick="startGame()">BẮT ĐẦU CHƠI</button>
        <button class="btn" onclick="switchScreen('settings-screen')">CÀI ĐẶT</button>
        <button class="btn" onclick="switchScreen('credits-screen')">THÔNG TIN</button>
    </div>

    <div id="settings-screen" class="screen">
        <h1>Cài Đặt</h1>
        <p>Âm thanh: Đã sẵn sàng</p>
        <button class="btn" onclick="switchScreen('menu-screen')">QUAY LẠI</button>
    </div>

    <div id="credits-screen" class="screen">
        <h1>Thông Tin</h1>
        <p>Phát triển bởi: HPK & CMD34</p>
        <button class="btn2" style="border-color:#ff00ff; color: var(--primary-gold)" onclick="window.open('https://www.youtube.com/watch?v=l3JdTYIHn-o&t=44s')">🎁 BÍ MẬT</button>
        <button class="btn" onclick="switchScreen('menu-screen')">QUAY LẠI</button>
    </div>

    <div id="quiz-part" class="screen">
        <div id="question-counter" style="color: var(--primary-gold); text-align: left; font-weight: bold; margin-bottom: 10px;">Câu hỏi 1/4</div>
        <div class="quiz-wrapper" id="quiz-wrapper" style="display: flex;">
            <div class="image-side">
                <img id="q-image" src="https://via.placeholder.com/400x225" alt="Quiz">
            </div>
            <div class="question-side">
                <div id="question-text">Câu hỏi đang tải...</div>
                <div id="options-container"></div>
            </div>
        </div>
    </div>

    <div id="victory-screen" class="screen">
        <div class="bell ring-anim" style="font-size: 100px;">🔔</div>
        <h1 style="color:var(--primary-gold)">CHIẾN THẮNG!</h1>
        <button class="btn" onclick="location.reload()">CHƠI LẠI</button>
    </div>

    <div id="effect-overlay">
        <div id="overlay-bell" style="font-size: 120px;">🔔</div>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Đâu là hoạt động vì cộng đồng?",
            img: "https://images.unsplash.com/photo-1555921015-5532091f6026?w=500",
            options: ["A. Lễ hội quê hương.", "B. Thiện nguyện.", "Lễ tình nhân", "D. Biểu diễn văn nghệ."],
            correct: 1
        },
        {
            q: "Những hành vi giao tiếp, ứng xử không có văn hóa khi tham gia các hoạt động trong cộng đồng là",
            img: "https://static0.srcdn.com/wordpress/wp-content/uploads/2023/01/griffith-on-the-cover-of-berserk-the-golden-age-movie-three-the-advent.jpg?w=1200&h=675&fit=crop",
            options: ["A. Nhẹ nhàng, ân cần, hỗ trợ.", "B. Xếp hàng khi sử dụng các dịch vụ công cộng.", "C. Nói lời cảm ơn khi được giúp đỡ, xin lỗi khi làm phiền tới người khác", "D. Bật nhạc to để mọi người cùng nghe và hưởng ứng nơi công cộng."],
            correct: 3
        },
        {
            q: "Yếu tố nào sau đây là rào cản lớn đối với sự phát triển mạng lưới quan hệ cộng đồng? ",
            img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500",
            options: ["A. Thiếu sự tin tưởng giữa các thành viên", "B. Chính quyền địa phương hỗ trợ cộng đồng.", "C. Nhiều hoạt động kết nối được tổ chức.", "D. Tinh thần hợp tác giữa các cá nhân cao."],
            correct: 0
        },
        {
            q: "Hoạt động nào giúp tăng cường mạng lưới quan hệ cộng đồng? ",
            img: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500",
            options: ["A. Các buổi họp tổ dân phố.", "B. Các sự kiện từ thiện, tình nguyện.", "C. Các chương trình giao lưu văn hóa, thể thao.", "D.Tổ chức hội thảo và sự kiện vì cộng đồng."],
            correct: "ALWAYS_TRUE"
        },
        {
            q: "Mạng lưới quan hệ cộng đồng ở địa phương là gì? ",
            img: "https://kinhmatkavi.vn/wp-content/uploads/2025/01/5-buoc-xay-dung-networking-moi-quan-he-tot-hieu-qua.webp",
            options: ["Các mối quan hệ giữa các cá nhân trong cùng một gia đình.", " Các tổ chức, cá nhân trong cùng một địa phương có sự liên kết, hỗ trợ lẫn nhau.", " Hệ thống giao thông và cơ sở hạ tầng trong khu vực.", " Các nhóm bạn thân cùng sinh sống trong một khu vực."],
            correct: 1
        },
        {
            q: "Truyền thống quê hương là những giá trị tốt đẹp, riêng biệt của mỗi vùng miền, địa phương, được hình thành và khẳng định qua",
            img: "https://cdn.thuvienphapluat.vn/uploads/laodongtienluong/20230301/PDP/hinh-anh-2757.jpg",
            options: ["A. Lối sống", " B. Định kiến", " C. Thời gian.", " D. Quan niệm."],
            correct: 2
        },
        {
            q: "Đâu là hành vi có văn hóa khi tham gia hoạt động cộng đồng?",
            img: "https://tiengviethuchanh.wordpress.com/wp-content/uploads/2018/10/h3.jpg",
            options: ["A. Lễ phép với người lớn.", " B. Làm ồn nơi cộng cộng.", "C. Mặc trang phục không phù hợp.", " D. Chém người xong chạy"],
            correct: 0
        },
        {
            q:"Yếu tố nào ảnh hưởng lớn nhất đến sự phát triển của mạng lưới quan hệ cộng đồng? ",
            img: " https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlSTb_tmEzBAhKPwGZlD40YjsWuOzxt4TksA&s",
            options: [ "A. Điều kiện kinh tế của khu vực.","B. Trình độ học vấn của người dân.","C. Mức độ gắn kết, tương tác giữa các cá nhân và tổ chức.","D. Chính sách phát triển của nhà nước."],
            correct: 2,
        },
    ];

    let currentQ = 0;
    const bgMusic = document.getElementById('bg-music');

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
    }

    function startGame() {
        bgMusic.play().catch(() => {});
        currentQ = 0;
        switchScreen('quiz-part');
        loadQuestion();
    }

    function loadQuestion() {
        const data = questions[currentQ];
        document.getElementById("question-counter").innerText = `CÂU HỎI ${currentQ + 1}/${questions.length}`;
        document.getElementById("question-text").innerText = data.q;
        document.getElementById("q-image").src = data.img;
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        data.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(index, btn) {
        const data = questions[currentQ];
        const allBtns = document.querySelectorAll(".question-side .btn");
        allBtns.forEach(b => b.classList.add('disabled'));

        const isCorrect = (data.correct === "ALWAYS_TRUE" || index === data.correct);

        if (isCorrect) {
            btn.classList.add('correct');
            setTimeout(nextStep, 1200);
        } else {
            btn.classList.add('wrong');
            if (data.correct !== "ALWAYS_TRUE") allBtns[data.correct].classList.add('correct');
            
            setTimeout(() => {
                showBreakEffect();
            }, 800);
        }
    }

    function showBreakEffect() {
        const overlay = document.getElementById('effect-overlay');
        const bell = document.getElementById('overlay-bell');
        overlay.style.display = 'flex';
        bell.innerText = '🔔';
        bell.classList.remove('break-anim');
        void bell.offsetWidth; 
        bell.classList.add('break-anim');

        setTimeout(() => { bell.innerText = '💔'; }, 450);

        setTimeout(() => {
            overlay.style.display = 'none';
            nextStep();
        }, 1500);
    }

    function nextStep() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            switchScreen('victory-screen');
        }
    }
</script>

</body>
</html>
